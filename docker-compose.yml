version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Mount data artefacts from host so you don't have to re-embed inside the
      # container. Run scripts/prepare_data.py and scripts/build_clusters.py on
      # the host first, then docker-compose up.
      - ./data:/app/data
      - ./cache:/app/cache
      - ./visualizations:/app/visualizations
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
